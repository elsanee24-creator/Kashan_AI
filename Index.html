
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kashan.ai — Your AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #153b27;
      background:
        radial-gradient(circle at 10% 10%, #caff9e, transparent 35%),
        radial-gradient(circle at 90% 80%, #a5ffd2, transparent 35%),
        linear-gradient(135deg, #f5fff4, #e4ffe5);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 7%;
      border-bottom: 1px solid #bcebc4;
    }

    .logo {
      font-size: 27px;
      font-weight: bold;
      color: #176b36;
    }

    .logo span {
      color: #72d900;
      text-shadow: 0 0 12px #aaff55;
    }

    .status {
      font-size: 12px;
      background: #e1ffcf;
      padding: 9px 13px;
      border-radius: 20px;
      border: 1px solid #a8e78d;
    }

    main {
      width: min(760px, 92%);
      margin: 65px auto 35px;
      text-align: center;
    }

    .orb {
      width: 76px;
      height: 76px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d8ffb7, #6df52c);
      box-shadow: 0 0 22px #a6ff72, 0 0 55px #b9ffd0;
      display: grid;
      place-items: center;
      font-size: 35px;
    }

    h1 {
      font-size: clamp(35px, 7vw, 54px);
      margin-bottom: 14px;
    }

    h1 span {
      color: #35a928;
    }

    .subtitle {
      color: #52745c;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .chat {
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid #b8e8bc;
      border-radius: 22px;
      padding: 20px;
      text-align: left;
      box-shadow: 0 12px 40px #55bb5c20;
      backdrop-filter: blur(12px);
    }

    #messages {
      min-height: 130px;
      max-height: 300px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 18px;
    }

    .message {
      padding: 12px 15px;
      border-radius: 15px;
      line-height: 1.5;
      max-width: 90%;
      overflow-wrap: anywhere;
    }

    .assistant {
      background: #eaffdf;
      align-self: flex-start;
    }

    .user {
      background: #d5ffb5;
      align-self: flex-end;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border: 1px solid #b5dfb7;
      border-radius: 13px;
      outline: none;
      font-size: 15px;
      background: #fbfffa;
    }

    input:focus {
      border-color: #54c938;
      box-shadow: 0 0 0 3px #a6ff7235;
    }

    button {
      padding: 0 20px;
      border: none;
      border-radius: 13px;
      color: #123c1b;
      background: #9cff58;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #7cef36;
    }

    .note {
      font-size: 12px;
      color: #65806a;
      text-align: center;
      margin-top: 14px;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #64816b;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">Kashan<span>.ai</span></div>
    <div class="status">✦ AI Workspace</div>
  </header>

  <main>
    <div class="orb">✧</div>

    <h1>Meet <span>Kashan.ai</span></h1>
    <p class="subtitle">
      Your ideas. Your questions. A smarter way to explore.
      <br>Welcome to your own AI workspace.
    </p>

    <section class="chat">
      <div id="messages" aria-live="polite">
        <div class="message assistant">
          Hi! Welcome to Kashan.ai. What would you like to explore?
        </div>
      </div>

      <form id="chatForm" class="input-row">
        <input
          id="userInput"
          type="text"
          placeholder="Message Kashan.ai..."
          aria-label="Your message"
          required
        >
        <button type="submit">Send ➤</button>
      </form>

      <p class="note">
        Preview version — AI connection will be added in the next step.
      </p>
    </section>
  </main>

  <footer>Made with curiosity · Kashan.ai</footer>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("userInput");
    const messages = document.getElementById("messages");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = text;
      messages.appendChild(userMessage);

      const reply = document.createElement("div");
      reply.className = "message assistant";
      reply.textContent =
        "Your message was received! The real AI model isn't connected yet. We'll connect it in the next step.";
      messages.appendChild(reply);

      input.value = "";
      messages.scrollTop = messages.scrollHeight;
    });
  </script>
</body>
</html>
